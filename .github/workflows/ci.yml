name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - uses: extractions/setup-just@v3

      - name: Lint, format and lock files
        run: just check

      - name: Pre-commit hooks on all files
        run: uvx pre-commit run --all-files --show-diff-on-failure
