[project]
name = "digits"
version = "0.1.0"
description = "Data loading, model and evaluation shared by the digit experiments and the demo"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4",
    "numpy>=2",
    "pillow>=10",
    "safetensors>=0.4",
    "torch>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
